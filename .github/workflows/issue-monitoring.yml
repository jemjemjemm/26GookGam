name: Issue monitoring update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'monitoring-src/**'
      - '.github/workflows/issue-monitoring.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: issue-monitoring-update
  cancel-in-progress: false
jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install article extraction dependency
        run: pip install beautifulsoup4==4.12.3
      - name: Verify source and publication boundaries
        working-directory: monitoring-src
        run: |
          python -m unittest discover -s tests -q
          node tests/headline-observation.cjs
          node tests/sk-impact.cjs
      - name: Collect public titles and build read API
        working-directory: monitoring-src
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python -m workers.github_build --out ../issue-monitoring --state ../monitoring-state/news.json
      - name: Save durable public ledger and page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add issue-monitoring monitoring-state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public issue news and report drafts [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Request existing branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
