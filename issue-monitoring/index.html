<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>D-Issue</title>
<link rel="stylesheet" href="./style.css?v=4a31ab943c5f">
</head>
<body>
<main>
<header><h1 id="heading">D-Issue</h1><div class="head-actions"><button id="readiness">연결 상태</button><button id="report">보고서</button></div></header>
<div hidden><select id="dataset"><option value="live" selected>live</option><option value="demo">demo</option></select><span id="mode"></span></div>
<div id="notice" hidden></div>
<details class="filters"><summary>조회 조건</summary>
<section class="toolbar" aria-label="필터">
<label>시간창<select id="hours"><option value="1">최근 1시간</option><option value="3">최근 3시간</option><option value="6">최근 6시간</option><option value="12">최근 12시간</option><option value="24">최근 24시간</option><option value="archive" selected>전체 수집 기사</option></select></label>
<label>채널<select id="channel"><option value="all">전체 채널</option><option value="media">언론</option><option value="portal">포털 댓글</option><option value="community">커뮤니티</option><option value="sns">SNS</option><option value="broadcast">방송</option></select></label>
<label class="search">검색<input id="search" type="search" placeholder="제목·내용 검색" enterkeyhint="search"></label>
<label class="cutoff">최근 수집 시각 · 한국시간<input id="cutoff" type="datetime-local" value="2026-10-07T21:30"></label>
<button id="refresh">조회</button>
</section></details>
<div id="status" role="status"></div><section id="content" aria-live="polite"></section>
<footer><span>공식 사실과 보도·온라인 주장을 구분합니다.</span><span id="updated"></span><button id="browser-check">브라우저 점검</button></footer>
</main>
<nav class="app-nav" aria-label="페이지 이동">
<button class="nav" id="back-top" aria-label="맨 위로 올라가기"><span aria-hidden="true">↑</span><small>맨 위로</small></button>
</nav>
<div id="dialog-backdrop" hidden></div>
<dialog id="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title"><div class="dialog-head"><h2 id="detail-title">분석 근거</h2><button id="close-dialog" aria-label="닫기">✕</button></div><div id="detail-body"></div></dialog>
<script src="./headline-observation.js?v=8ad23935cc2f"></script><script src="./impact-reference.js?v=508541ea1743"></script><script src="./sk-impact.js?v=a4c7ef057f03"></script><script src="./pages-api.js?v=9052a468d7c0"></script><script src="./app.js?v=61c910f873ba"></script><script src="./browser-check.js?v=be9965600deb"></script></body></html>
